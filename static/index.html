<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>个人数据权利请求</title>
<style>body{font:15px/1.6 system-ui,sans-serif;max-width:1180px;margin:28px auto;padding:0 20px;color:#263842}table{border-collapse:collapse;width:100%;margin:14px 0}th,td{border:1px solid #d4dde2;padding:7px}th{background:#eef5f5}.card{background:#eef8f7;border-left:5px solid #2d827b;padding:12px 16px}code{background:#edf1f2;padding:2px 5px}.overdue{color:#a11b1b;font-weight:600}</style>
<h1>个人数据权利请求处理</h1><div class="card">请求和位置按角色过滤。页面不展示联系方式明文。写接口需要 <code>X-User</code>、<code>X-Role</code>，详见 README。</div>
<h2>处理队列</h2><table id="requests"><thead><tr><th>请求号</th><th>类型</th><th>地区</th><th>状态</th><th>到期日</th><th>处理人</th></tr></thead><tbody></tbody></table>
<h2>数据定位</h2><table id="locations"><thead><tr><th>请求</th><th>系统</th><th>类别</th><th>状态</th><th>遮蔽</th><th>内容指纹</th><th>法律保留</th></tr></thead><tbody></tbody></table>
<h2>交付包</h2><table id="packages"><thead><tr><th>请求</th><th>版本</th><th>状态</th><th>条目</th><th>清单指纹</th><th>封存时间</th><th>发出时间</th></tr></thead><tbody></tbody></table>
<script>const PS={sealed:'已封存',released:'已发出',withdrawn:'已撤回',superseded:'已被补正替代'};const RS={pending:'未登记',not_required:'无需遮蔽',redacted:'已遮蔽',exempted:'例外'};async function load(){const d=await fetch('/api/state').then(r=>r.json());document.querySelector('#requests tbody').innerHTML=d.requests.map(r=>`<tr class="${r.overdue?'overdue':''}"><td>${r.request_no}</td><td>${r.request_type}</td><td>${r.jurisdiction}</td><td>${r.status}</td><td>${r.due_date}</td><td>${r.assigned_to||''}</td></tr>`).join('');document.querySelector('#locations tbody').innerHTML=d.locations.map(r=>`<tr><td>${r.request_id}</td><td>${r.system_name}</td><td>${r.data_category}</td><td>${r.status}</td><td>${RS[r.redaction_status]||r.redaction_status}</td><td>${r.content_fingerprint?r.content_fingerprint.slice(0,12)+'…':''}</td><td>${r.legal_hold?'是':'否'}</td></tr>`).join('');document.querySelector('#packages tbody').innerHTML=(d.packages||[]).map(p=>`<tr><td>${p.request_id}</td><td>v${p.version_no}</td><td>${PS[p.status]||p.status}</td><td>${p.item_count}</td><td>${p.manifest_hash.slice(0,12)}…</td><td>${p.sealed_at}</td><td>${p.released_at||''}</td></tr>`).join('')}load()</script></html>
